name: Validate

on:
  pull_request:
  push:
    branches:
      - chore/preproduction-staging

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run validate:predeploy
      - name: Audit frontend runtime
        run: npm audit --omit=dev
      - name: Audit Functions runtime
        run: npm --prefix functions audit --omit=dev --audit-level=high
